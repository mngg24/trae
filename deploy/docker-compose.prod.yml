services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend-api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    depends_on:
      - redis
      - videosup
    restart: unless-stopped
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      DB_URL: ${DB_URL:-sqlite+pysqlite:////data/app.db}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:5173}
      PROVIDERS_MODE: ${PROVIDERS_MODE:-mock}
      PIXVERSE_API_KEY: ${PIXVERSE_API_KEY:-}
      PIXVERSE_MODEL: ${PIXVERSE_MODEL:-v6}
      PIXVERSE_ASPECT_RATIO: ${PIXVERSE_ASPECT_RATIO:-9:16}
      PIXVERSE_QUALITY: ${PIXVERSE_QUALITY:-720p}
      PIXVERSE_DURATION_SEC: ${PIXVERSE_DURATION_SEC:-5}
      VIDEOSUP_BASE_URL: ${VIDEOSUP_BASE_URL:-http://videosup:9010}
    volumes:
      - backend-db:/data

  backend-worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    depends_on:
      - redis
      - videosup
    restart: unless-stopped
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      DB_URL: ${DB_URL:-sqlite+pysqlite:////data/app.db}
      PROVIDERS_MODE: ${PROVIDERS_MODE:-mock}
      PIXVERSE_API_KEY: ${PIXVERSE_API_KEY:-}
      PIXVERSE_MODEL: ${PIXVERSE_MODEL:-v6}
      PIXVERSE_ASPECT_RATIO: ${PIXVERSE_ASPECT_RATIO:-9:16}
      PIXVERSE_QUALITY: ${PIXVERSE_QUALITY:-720p}
      PIXVERSE_DURATION_SEC: ${PIXVERSE_DURATION_SEC:-5}
      VIDEOSUP_BASE_URL: ${VIDEOSUP_BASE_URL:-http://videosup:9010}
    command:
      - celery
      - -A
      - worker.celery_app.celery_app
      - worker
      - --loglevel=INFO
    volumes:
      - backend-db:/data

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2024-12-18T13-15-44Z
    depends_on:
      - minio
    entrypoint:
      - sh
      - -lc
      - >
        mc alias set local http://minio:9000 "${MINIO_ROOT_USER:-minioadmin}" "${MINIO_ROOT_PASSWORD:-minioadmin}"
        && mc mb -p "local/${VIDEOSUP_S3_BUCKET:-videosup}" || true
        && mc anonymous set download "local/${VIDEOSUP_S3_BUCKET:-videosup}"

  videosup:
    build:
      context: ../VideoSup/worker
      dockerfile: Dockerfile
    depends_on:
      - minio-init
    restart: unless-stopped
    environment:
      VIDEOSUP_STORAGE_BACKEND: s3
      VIDEOSUP_S3_ENDPOINT_URL: http://minio:9000
      VIDEOSUP_S3_PUBLIC_BASE_URL: ${VIDEOSUP_PUBLIC_BASE_URL:-http://localhost:9000}
      VIDEOSUP_S3_BUCKET: ${VIDEOSUP_S3_BUCKET:-videosup}
      VIDEOSUP_S3_PREFIX: ${VIDEOSUP_S3_PREFIX:-videosup}
      VIDEOSUP_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      VIDEOSUP_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      VIDEOSUP_UPLOAD_MODE: sync
      PORT: "9010"

  caddy:
    image: caddy:2-alpine
    depends_on:
      - backend-api
      - minio
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:-api.localhost}
      MEDIA_DOMAIN: ${MEDIA_DOMAIN:-media.localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  backend-db:
  minio-data:
  caddy-data:
  caddy-config:
