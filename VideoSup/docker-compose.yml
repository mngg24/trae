services:
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"

  minio-init:
    image: minio/mc:RELEASE.2024-12-18T13-15-44Z
    depends_on:
      - minio
    entrypoint:
      - sh
      - -lc
      - >
        mc alias set local http://minio:9000 "${MINIO_ROOT_USER:-minioadmin}" "${MINIO_ROOT_PASSWORD:-minioadmin}"
        && mc mb -p "local/${VIDEOSUP_S3_BUCKET:-videosup}" || true
        && mc anonymous set download "local/${VIDEOSUP_S3_BUCKET:-videosup}"

  videosup:
    build:
      context: ./worker
      dockerfile: Dockerfile
    depends_on:
      - minio-init
    ports:
      - "9010:9010"
    environment:
      VIDEOSUP_STORAGE_BACKEND: s3
      VIDEOSUP_S3_ENDPOINT_URL: http://minio:9000
      VIDEOSUP_S3_PUBLIC_BASE_URL: ${VIDEOSUP_PUBLIC_BASE_URL:-http://localhost:9000}
      VIDEOSUP_S3_BUCKET: ${VIDEOSUP_S3_BUCKET:-videosup}
      VIDEOSUP_S3_PREFIX: ${VIDEOSUP_S3_PREFIX:-videosup}
      VIDEOSUP_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      VIDEOSUP_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      VIDEOSUP_STORAGE_MAX_CONCURRENCY: "8"
      PORT: "9010"
